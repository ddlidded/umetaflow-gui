name: Build macOS DMG (Web UI)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-webui.txt

      - name: Build .app with PyInstaller
        run: python -m PyInstaller --clean --noconfirm umetaflow_webui_macos.spec

      - name: Create DMG
        run: |
          hdiutil create -volname "UmetaFlow" -srcfolder "dist/UmetaFlow.app" -ov -format UDZO "UmetaFlow.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: UmetaFlow-macos-dmg
          path: UmetaFlow.dmg

