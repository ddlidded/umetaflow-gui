<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}UmetaFlow{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "Segoe UI", "Roboto", "Helvetica", "Arial"],
            },
            colors: {
              brand: {
                50: "#eef2ff",
                100: "#e0e7ff",
                200: "#c7d2fe",
                300: "#a5b4fc",
                400: "#818cf8",
                500: "#6366f1",
                600: "#4f46e5",
                700: "#4338ca",
                800: "#3730a3",
                900: "#312e81",
              },
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.2/flowbite.min.css" rel="stylesheet" />
    <style>
      body{
        background:
          radial-gradient(900px 500px at 10% 0%, rgba(99,102,241,0.08), rgba(0,0,0,0) 55%),
          radial-gradient(900px 500px at 90% 10%, rgba(34,211,238,0.06), rgba(0,0,0,0) 55%),
          linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      }
    </style>
  </head>
  <body class="h-full text-slate-800 antialiased">
    <div class="min-h-full">
      <nav class="border-b border-slate-200 bg-white/90 backdrop-blur">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
          <div class="flex h-16 items-center justify-between">
            <div class="flex items-center gap-3">
              <img src="/assets/umetaflow-logo.png" class="h-9 w-9 rounded-xl ring-1 ring-slate-200 bg-white p-1" alt="UmetaFlow" />
              <div class="leading-tight">
                <div class="text-sm font-semibold">UmetaFlow</div>
                <div class="text-xs text-slate-500">Workspace: <span class="font-mono">{{ workspace_id }}</span></div>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <a href="/" class="rounded-xl px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100">Home</a>
              <a href="/upload" class="rounded-xl px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100">Upload</a>
              <a href="/configure" class="rounded-xl px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100">Configure</a>
              <a href="/run" class="rounded-xl px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100">Run</a>
              <a href="/results" class="rounded-xl px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100">Results</a>
              <a href="/statistics" class="rounded-xl px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100">Statistics</a>
            </div>
          </div>
        </div>
      </nav>
      <main class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
      </main>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.2/flowbite.min.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
